future_work:
- title: Verifier-Native RL
  text: Future RL may be built around cheap verifiers rather than dense rewards, making sparse but reliable supervision the default training signal.
  lane_ids:
  - M6
  - M5b
  lane_labels:
  - RL for LLMs
  - Offline RL
- title: Replay for Reasoning
  text: A major frontier is how to reuse long reasoning trajectories efficiently, turning replay from a control tool into a core ingredient of agent training.
  lane_ids:
  - M6
  - M3
  lane_labels:
  - RL for LLMs
  - Actor-Critic
- title: Trajectory Credit Assignment
  text: RL needs new mechanisms to assign credit across multi-step tool use, planning, and recovery, where the decisive action may occur far before the final outcome.
  lane_ids:
  - M6
  - M3
  lane_labels:
  - RL for LLMs
  - Actor-Critic
- title: Self-Improving Curricula
  text: Future agents may generate and curate their own training tasks, creating adaptive curricula instead of relying on fixed benchmark distributions.
  lane_ids:
  - M5a
  - M7
  lane_labels:
  - Model-Based RL
  - Exploration
- title: Population-Based Agents
  text: Training may shift from single policies to interacting populations, where cooperation, competition, and specialization become part of the learning algorithm.
  lane_ids:
  - M8
  - M6
  lane_labels:
  - Multi-Agent RL
  - RL for LLMs
