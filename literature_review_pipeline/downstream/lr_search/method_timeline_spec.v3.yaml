topic:
  title: Evolution of Deep Neural Network Methods
  subtitle: Canonical anchors per method family · filled = retrieved or S2-verified,
    dashed = still injected
  time_range:
  - 1955
  - 2026
  current_year: 2026
  future_work_width: 350
  demo_row_height: 84
future_work:
- title: Beyond Quadratic Context
  text: Long-context learning will likely require memory mechanisms that go beyond
    standard attention, not just larger windows or more aggressive caching.
  lane_ids:
  - C2
  - C12
- title: Post-Transformer Backbones
  text: The next architectural shift may come from hybrids that combine attention,
    state-space dynamics, sparsity, and external memory rather than scaling one backbone
    further.
  lane_ids:
  - C2
  - C12
- title: Compute-Routed Models
  text: Future foundation models may route not only parameters but also depth, memory,
    and compute, making conditional computation a first-class design principle.
  lane_ids:
  - C2
  - C9
- title: Causal Uncertainty Reduction
  text: A key frontier is to reduce uncertainty through causal structure and intervention-aware
    modeling, not only through better probabilistic prediction.
  lane_ids:
  - C2
  - C7
- title: Native World Representations
  text: Foundation models may need to represent events, spaces, graphs, and actions
    natively instead of flattening everything into token sequences.
  lane_ids:
  - C14
  - C2
