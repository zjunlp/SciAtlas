# Method × Time anchor spec for the Reinforcement-Learning case study.
#
# Same conventions as the DNN spec:
# - in_corpus: true  -> filled dot (paper was retrieved by lr_search and present in
#                       clusters_recovered.json; corpus_paper_id is the matching P-id).
# - in_corpus: false -> dashed hollow dot (canonical anchor we inject manually
#                       because retrieval missed it).
# - citation_count is approximate; edit as you wish.
# - label is the short text shown next to the dot.
# - full_title appears in the hover tooltip.
#
# Edit this file freely and re-render with render_method_timeline.py.

topic:
  title: "Evolution of Reinforcement Learning Algorithms"
  subtitle: "Canonical anchors per method family · filled = retrieved, dashed = injected"
  time_range: [1985, 2026]
  current_year: 2026
  row_height: 165
  time_segments:
    - {start: 1985, end: 2000, weight: 0.14}
    - {start: 2000, end: 2013, weight: 0.06}
    - {start: 2013, end: 2016, weight: 0.16}
    - {start: 2016, end: 2018, weight: 0.18}
    - {start: 2018, end: 2021, weight: 0.18}
    - {start: 2021, end: 2024, weight: 0.16}
    - {start: 2024, end: 2026, weight: 0.12}

